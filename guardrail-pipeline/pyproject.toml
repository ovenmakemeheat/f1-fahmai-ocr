[project]
name = "spai-asm1"
version = "0.1.0"
description = "Super AI Assignment 1: Data Analysis and Visualization"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "accelerate>=0.33",
    "brotli>=1.2.0",
    "fastapi>=0.115",
    "fonttools>=4.62.1",
    "google-genai>=1.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "openai>=2.33.0",
    "pandas>=2.3.3",
    "plotly>=5.15.0",
    "pyngrok>=7.2",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "safetensors>=0.4",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2",
    "seaborn>=0.13.2",
    "torch",
    "tqdm>=4.67.1",
    "transformers>=4.44",
    "uvicorn[standard]>=0.30",
]


[tool.uv]
default-groups = ["dev", "notebook"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["ruff>=0.14.13", "ruff-lsp>=0.0.62"]
notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2",
    "nbconvert>=7.16.6",
    "nbqa>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"] # Allow imports not at top of file in notebooks

[tool.nbqa]
addopts = "--ruff"
