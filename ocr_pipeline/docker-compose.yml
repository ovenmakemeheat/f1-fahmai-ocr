version: "3.9"

services:
  api:
    build: .
    container_name: ocr_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ${PER_ARTIFACT_DIR:-./per_artifact}:/data/fahmai/per_artifact:ro
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8080
        --workers ${API_WORKERS:-4}
